  el.addEventListener('pointerdown', function (e) { if (e.button > 0) { return; } e.preventDefault(); fn(e); });
  el.addEventListener('click', function (e) { if (!e.detail) { fn(e); } });
}
(function () {
  var d = IG.data, a = IG.atur, $ = IG.$, urut = [], pos = 0, benar = 0, salah = [], selesai = false, fase = 'diam', energi = [0, 0], bingkai = 0, tunda = null;
  $('ringkas').textContent = d.pernyataan.length + ' pernyataan. Dengan kamera: bergerak ke kiri untuk BENAR, ke kanan untuk SALAH. Tanpa kamera: sentuh sisi layar atau tekan B/S.';
  if ($('pid-kamera')) { $('pid-kamera').addEventListener('click', function () { PID.kamera(64, 48).catch(function () {}); }); }
  PID.atur(function (img) {
    var g = PID.gerak(img, 2);
    if (fase !== 'gerak') { return; }
    energi[0] += g[0]; energi[1] += g[1]; bingkai++;
    var tot = Math.max(0.0001, energi[0] + energi[1]);
    $('meter-0').style.width = Math.round(energi[0] / tot * 100) + '%'; $('meter-1').style.width = Math.round(energi[1] / tot * 100) + '%';
  });
  function mulai() { urut = a.acak ? IG.acak(d.pernyataan) : d.pernyataan.slice(); pos = 0; benar = 0; salah = []; IG.tampil('layar-main'); tampilkan(); }
  function tampilkan() {
    var p = urut[pos]; selesai = false; clearTimeout(tunda);
    $('nomor').textContent = 'Pernyataan ' + (pos + 1) + ' dari ' + urut.length; $('nilai').textContent = 'Benar: ' + benar;
    $('progres').style.width = (pos / urut.length * 100) + '%'; $('tanya').textContent = p.teks;
    ['pilih-benar', 'pilih-salah'].forEach(function (id) { $(id).disabled = false; $(id).classList.remove('benar', 'salah'); });
    $('umpan').hidden = true; $('lanjut').hidden = true; $('tanya').focus();
    if (PID.aktif()) { deteksi(); } else { fase = 'diam'; $('status-gerak').textContent = 'Sentuh BENAR atau SALAH.'; }
  }
  function deteksi() {
    clearTimeout(tunda); energi = [0, 0]; bingkai = 0; $('ulang-deteksi').hidden = true; $('meter-0').style.width = '0'; $('meter-1').style.width = '0';
    fase = 'siap'; $('status-gerak').textContent = 'Baca pernyataannya… bersiap!';
    tunda = setTimeout(function () {
      fase = 'gerak'; var sisa = a.detik;
      (function hitung() {
        if (fase !== 'gerak') { return; }
        if (sisa <= 0) { putuskan(); return; }
        $('status-gerak').textContent = 'Bergerak sekarang! ' + sisa; sisa--; tunda = setTimeout(hitung, 1000);
      })();
    }, 2500);
  }
  function putuskan() {
    fase = 'diam';
    var tot = energi[0] + energi[1], besar = energi[0] >= energi[1] ? 0 : 1;
    if (bingkai === 0 || tot / bingkai < 0.01 || energi[besar] < energi[1 - besar] * 1.3) {
      $('status-gerak').textContent = 'Gerakan belum jelas. Ulangi, atau sentuh BENAR/SALAH.'; $('ulang-deteksi').hidden = false; $('ulang-deteksi').focus(); return;
    }
    $('status-gerak').textContent = 'Kelas memilih ' + (besar === 0 ? 'BENAR' : 'SALAH') + '.'; jawab(besar === 0);
  }
  function jawab(pilihan) {
    if (selesai) { return; }
    selesai = true; fase = 'diam'; clearTimeout(tunda); $('ulang-deteksi').hidden = true;
    var p = urut[pos], tepat = pilihan === p.benar;
    $('pilih-benar').disabled = true; $('pilih-salah').disabled = true;
    $(p.benar ? 'pilih-benar' : 'pilih-salah').classList.add('benar'); if (!tepat) { $(pilihan ? 'pilih-benar' : 'pilih-salah').classList.add('salah'); }
    if (tepat) { benar++; } else { salah.push(p); }
    var u = $('umpan'); u.className = 'umpan ' + (tepat ? 'benar' : 'salah'); u.textContent = '';
    u.appendChild(IG.el('strong', null, (tepat ? 'Tepat! ' : 'Belum tepat. ') + 'Pernyataan ini ' + (p.benar ? 'BENAR.' : 'SALAH.')));
    if (a.pembahasan && p.pembahasan) { u.appendChild(IG.el('p', null, p.pembahasan)); }
    u.hidden = false; $('nilai').textContent = 'Benar: ' + benar;
    $('lanjut').textContent = pos === urut.length - 1 ? 'Lihat hasil' : 'Berikutnya'; $('lanjut').hidden = false; $('lanjut').focus();
  }
  ketuk($('pilih-benar'), function () { jawab(true); });
  ketuk($('pilih-salah'), function () { jawab(false); });
  $('ulang-deteksi').addEventListener('click', deteksi);
  $('lanjut').addEventListener('click', function () {
    if (pos < urut.length - 1) { pos++; tampilkan(); return; }
    fase = 'diam'; clearTimeout(tunda);
    IG.hasil({ benar: benar, total: urut.length, ulas: salah.map(function (p) { return { judul: p.teks, isi: [{ label: 'Jawaban', teks: p.benar ? 'Benar' : 'Salah' }] }; }) });
  });
  document.addEventListener('keydown', function (e) {
    if ($('layar-main').hidden || selesai || e.ctrlKey || e.metaKey || e.altKey) { return; }
    var k = String(e.key).toLowerCase();
    if (k === 'b') { e.preventDefault(); jawab(true); } else if (k === 's') { e.preventDefault(); jawab(false); }
  });
  IG.siapkan(mulai);
})();
</script>
